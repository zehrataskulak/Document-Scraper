<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Scraper Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

    <div class="flex flex-col md:flex-row min-h-screen">
        
        <!-- LEFT PANEL: Upload Context Control -->
        <div class="w-full md:w-1/3 bg-gray-800 p-8 border-b md:border-b-0 md:border-r border-gray-700">
            <h1 class="text-2xl font-bold text-teal-400 mb-2">📄 Document Scraper</h1>
            <p class="text-gray-400 text-sm mb-6">Upload PDF, DOCX, or TXT files to automatically parse and extract raw text.</p>
            
            <form id="uploadForm" class="space-y-6">
                <div class="flex items-center justify-center w-full">
                    <label class="flex flex-col items-center justify-center w-full h-48 border-2 border-gray-600 border-dashed rounded-lg cursor-pointer bg-gray-700 hover:bg-gray-600 transition relative">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6 text-center">
                            <svg class="w-8 h-8 mb-4 text-teal-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                            </svg>
                            <p class="mb-2 text-sm text-gray-300"><span class="font-semibold">Click to browse file</span></p>
                            <p class="text-xs text-gray-400">Supported types: PDF, DOCX, TXT</p>
                            <!-- SIZE WARNING -->
                            <p class="text-xs font-bold text-amber-500 mt-2 bg-amber-500/10 py-1 px-2 rounded">Maximum file size: 5 MB</p>
                        </div>
                        <input id="fileInput" type="file" accept="*/*" class="hidden" required />
                    </label>
                </div>

                <div id="fileStatus" class="text-sm text-gray-400 hidden">
                    Selected File: <span id="fileName" class="text-teal-400 font-semibold"></span>
                    <span id="fileSize" class="text-gray-500 ml-2 text-xs"></span>
                </div>

                <button type="submit" class="w-full bg-teal-500 hover:bg-teal-600 text-gray-950 font-bold py-3 px-4 rounded-lg transition shadow-lg">
                    Extract & Process
                </button>
            </form>

            <div id="statusContainer" class="mt-6 p-4 rounded-lg hidden bg-gray-700 border border-gray-600">
                <p id="statusText" class="text-sm font-medium"></p>
            </div>
        </div>

        <!-- RIGHT PANEL: Metadata Archive View -->
        <div class="w-full md:w-2/3 p-8 overflow-y-auto">
            <h2 class="text-xl font-bold text-gray-200 mb-6 flex items-center gap-2">
                📊 Processed Documents Archive
            </h2>

            <div class="overflow-x-auto bg-gray-800 rounded-lg border border-gray-700 shadow-xl">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-700 text-gray-300 text-sm uppercase">
                            <th class="p-4">DB ID</th>
                            <th class="p-4">Filename</th>
                            <th class="p-4">Upload Date</th>
                            <th class="p-4">Type</th>
                            <th class="p-4">Words</th>
                            <th class="p-4">Chars</th>
                            <th class="p-4">Action</th>
                        </tr>
                    </thead>
                    <tbody id="documentTableBody" class="divide-y divide-gray-700 text-sm text-gray-300">
                        <!-- Dynamic rows populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL: Inspection Panel -->
    <div id="detailModal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-gray-800 border border-gray-700 rounded-xl w-full max-w-3xl max-h-[80vh] flex flex-col shadow-2xl">
            <div class="p-6 border-b border-gray-700 flex justify-between items-center">
                <h3 id="modalTitle" class="text-lg font-bold text-teal-400">Document Inspection</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-200 text-xl font-bold">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4">
                <h4 class="text-sm font-semibold text-gray-400">Extracted & Preprocessed Text:</h4>
                <div id="modalText" class="bg-gray-900 p-4 rounded-lg text-gray-300 whitespace-pre-wrap text-sm border border-gray-800 leading-relaxed font-mono"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', fetchDocuments);

        const fileInput = document.getElementById('fileInput');
        const fileStatus = document.getElementById('fileStatus');
        const fileName = document.getElementById('fileName');
        const fileSizeLabel = document.getElementById('fileSize');
        
        // MAXIMUM SIZE LIMIT (5 MB)
        const MAX_FILE_SIZE_MB = 5;
        const MAX_FILE_SIZE_BYTES = MAX_FILE_SIZE_MB * 1024 * 1024;

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                fileName.textContent = file.name;
                
                // Calculating the file size in MB and displaying it on the screen
                const sizeInMB = (file.size / (1024 * 1024)).toFixed(2);
                fileSizeLabel.textContent = `(${sizeInMB} MB)`;
                
                fileStatus.classList.remove('hidden');
            }
        });

        async function fetchDocuments() {
            try {
                const response = await fetch('/documents');
                const documents = await response.json();
                const tbody = document.getElementById('documentTableBody');
                tbody.innerHTML = '';

                documents.forEach(doc => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-gray-750 transition border-b border-gray-800';
                    row.innerHTML = `
                        <td class="p-4 font-mono text-teal-500">${doc.document_id}</td>
                        <td class="p-4 font-medium max-w-xs truncate">${doc.original_filename}</td>
                        <td class="p-4 text-xs text-gray-400">${new Date(doc.upload_date).toLocaleString('en-US')}</td>
                        <td class="p-4"><span class="px-2 py-1 text-xs font-semibold rounded bg-gray-700 text-teal-300 uppercase">${doc.file_type}</span></td>
                        <td class="p-4 font-mono">${doc.word_count}</td>
                        <td class="p-4 font-mono">${doc.character_count}</td>
                        <td class="p-4">
                            <button onclick="viewDetails(${JSON.stringify(doc).replace(/"/g, '&quot;')})" class="bg-teal-500/10 text-teal-400 hover:bg-teal-500 hover:text-gray-950 px-3 py-1 rounded text-xs font-semibold transition">
                                View Text
                            </button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching data logs:', error);
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusContainer = document.getElementById('statusContainer');
            const statusText = document.getElementById('statusText');
            
            if (fileInput.files.length === 0) return;

            const file = fileInput.files[0];

            // FILE SIZE CHECK
            if (file.size > MAX_FILE_SIZE_BYTES) {
                statusContainer.classList.remove('hidden');
                statusText.className = 'text-sm font-medium text-rose-400';
                statusText.textContent = `❌ Error: The file size exceeds the ${MAX_FILE_SIZE_MB} MB limit.`;
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            statusContainer.classList.remove('hidden');
            statusText.className = 'text-sm font-medium text-amber-400 animate-pulse';
            statusText.textContent = '⏳ Parsing document and preprocessing data, please wait...';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    statusText.className = 'text-sm font-medium text-emerald-400';
                    statusText.textContent = '✅ Success! Document processed and recorded to database.';
                    fileInput.value = '';
                    fileStatus.classList.add('hidden');
                    fetchDocuments();
                } else {
                    const errData = await response.json();
                    statusText.className = 'text-sm font-medium text-rose-400';
                    statusText.textContent = `❌ Error: ${errData.detail || 'Execution failed.'}`;
                }
            } catch (error) {
                statusText.className = 'text-sm font-medium text-rose-400';
                statusText.textContent = '❌ Connection lost or internal engine failure.';
            }
        });

        function viewDetails(doc) {
            document.getElementById('modalTitle').textContent = `📄 ${doc.original_filename}`;
            document.getElementById('modalText').textContent = doc.extracted_text;
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }
    </script>
</body>
</html>
